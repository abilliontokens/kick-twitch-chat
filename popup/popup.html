<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kick + Twitch Chat</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" fill-rule="evenodd" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
      </span>
      <div>
        <h1>Kick + Twitch Chat</h1>
        <p class="sub">One merged chat stream</p>
      </div>
    </header>

    <section class="card hero">
      <div class="hero-copy">
        <span class="hero-title">Enabled on Kick &amp; Twitch</span>
      </div>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </section>

    <section class="card panel">
      <div class="panel-head">
        <span>Status</span>
        <button type="button" id="refresh" class="mini-btn">Reconnect</button>
      </div>
      <div class="panel-body status">
        <div class="row">
          <span class="dot" id="kick-dot"></span>
          <span class="who">Kick</span>
          <span class="value" id="kick-name">—</span>
        </div>
        <div class="row">
          <span class="dot twitch" id="twitch-dot"></span>
          <span class="who">Twitch</span>
          <span class="value" id="twitch-name">—</span>
        </div>
        <p class="hint" id="page-hint">Open a Kick or Twitch channel to see chat.</p>
      </div>
    </section>

    <form id="mapping" class="card panel">
      <div class="panel-head">Channel Mapping</div>
      <div class="panel-body">
        <label class="field">
          <span id="mapping-label">Twitch channel for this Kick channel</span>
          <div class="mapping-row">
            <input id="twitch-input" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. xqc" />
            <button type="submit" class="primary">Save</button>
          </div>
        </label>
        <div class="mapping-meta">
          <button type="button" id="reset" class="link-btn">Use same name</button>
          <span class="hint" id="mapping-hint">Defaults to the same name.</span>
        </div>
      </div>
    </form>

    <section class="card panel">
      <div class="panel-head">Chat Display</div>
      <div class="panel-group grid2">
        <label class="row-switch"><span>Timestamps</span><input id="timestamps" type="checkbox" /></label>
        <label class="row-switch"><span>Badges</span><input id="badges" type="checkbox" /></label>
        <label class="row-switch"><span>Kick Badges</span><input id="kick-badges" type="checkbox" /></label>
      </div>
      <div class="panel-group grid2">
        <label class="row-switch"><span>Twitch Tint</span><input id="tint-twitch" type="checkbox" /></label>
        <label class="row-switch"><span>Kick Tint</span><input id="tint-kick" type="checkbox" /></label>
        <label class="row-switch"><span>Color Bar</span><input id="color-bar" type="checkbox" /></label>
        <label class="row-switch"><span>Kick Icon</span><input id="kick-icon" type="checkbox" /></label>
      </div>
    </section>

    <footer>
      <p class="hint">Read-only. Send messages in the site's own input.</p>
      <p class="repo-line"><a href="https://github.com/abilliontokens/kick-twitch-chat" target="_blank" rel="noreferrer">Source on GitHub</a></p>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
